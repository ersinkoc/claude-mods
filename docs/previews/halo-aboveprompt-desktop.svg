<svg xmlns="http://www.w3.org/2000/svg" width="800" height="16" viewBox="0 0 800 16"><style>
.t{fill:#1f1f1f}.s{fill:#5f5f5c}.m{fill:#8e8e8a}.k{fill:#e7e5e0}.p{fill:#f5f4f1}.ln{stroke:#e1dfda}
@media (prefers-color-scheme: dark){.t{fill:#ededed}.s{fill:#b4b4b0}.m{fill:#7c7c78}.k{fill:#2d2d2b}.p{fill:#232322}.ln{stroke:#363634}}
.pulse{animation:kzp 1.6s ease-in-out infinite}@keyframes kzp{50%{opacity:.35}}
.spin{transform-box:fill-box;transform-origin:center;animation:kzs 2s linear infinite}@keyframes kzs{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.cm{animation:hcm 1.3s cubic-bezier(.5,0,.5,1) infinite}@keyframes hcm{from{transform:translateX(-140px)}to{transform:translateX(782px)}}</style><defs><filter id="hg" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="2.4"/></filter><clipPath id="hc"><rect x="38" y="6" width="762" height="4" rx="2"/></clipPath><clipPath id="hcg"><rect x="34" y="0" width="770" height="16"/></clipPath><linearGradient id="ht" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".85" stop-color="#77e6a0"/><stop offset="1" stop-color="#aef0c6"/></linearGradient></defs><rect x="38" y="6.5" width="762" height="3" rx="1.5" fill="#4ade80" opacity=".35"/><g clip-path="url(#hcg)"><rect class="cm" x="38" y="5" width="140" height="6" rx="3" fill="url(#ht)" filter="url(#hg)"/></g><g clip-path="url(#hc)"><rect class="cm" x="38" y="0" width="140" height="16" fill="url(#ht)"/></g><text fill="#4ade80" x="0" y="11.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="10" font-weight="700" text-anchor="start" font-variant-numeric="tabular-nums">Bash</text></svg>